server.port=8080
spring.application.name=wealth-tree-backend
# Frontend origin allowed by CORS (comma-separated). "*" is fine for the hackathon.
wealthtree.cors.allowed-origins=*
# FinPulse bridge (tools/kairos_server.py -> the team's prediction-agent). The API key lives in prediction-agent/.env, never here.
wealthtree.agent.url=http://localhost:8090
wealthtree.agent.timeout-seconds=90
wealthtree.agent.warmup=true
# Progress memory (tree history, committed actions). Delete the file or POST /api/demo/reset to start over.
wealthtree.state-file=data/wealth-tree-state.ser
server.servlet.encoding.force-response=true
